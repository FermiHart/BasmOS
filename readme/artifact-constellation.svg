<text x="820" y="193" fill="#8ea1ff" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="27" font-weight="800" text-anchor="middle" letter-spacing="0">256 B</text>
<text x="820" y="223" fill="#f1f4ff" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="700" text-anchor="middle" letter-spacing="1">JASH</text>
<circle cx="1060" cy="278" r="130.7" fill="#d58cff" fill-opacity=".06" stroke="#d58cff" stroke-opacity=".12"/>
