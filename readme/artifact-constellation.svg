<text x="1060" y="296" fill="#f1f4ff" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="700" text-anchor="middle" letter-spacing="1">J-PACK</text>
<text x="56" y="464" fill="#8794b8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="500" text-anchor="start" letter-spacing="0">Every size is read from and checked against ARTIFACTS.manifest.</text>
