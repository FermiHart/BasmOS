<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
<title id="title">BasmOS artifact constellation</title>
<desc id="desc">Five committed BasmOS artifacts arranged by their verified relationships and byte sizes.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#070a12"/><stop offset="0.52" stop-color="#111426"/><stop offset="1" stop-color="#071715"/>
  </linearGradient>
  <radialGradient id="jade"><stop stop-color="#c8fff0"/><stop offset="0.35" stop-color="#65fbd2"/><stop offset="1" stop-color="#158a78"/></radialGradient>
  <radialGradient id="sun"><stop stop-color="#fff2c2"/><stop offset="0.4" stop-color="#ffcc66"/><stop offset="1" stop-color="#b56722"/></radialGradient>
  <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="9"/></filter>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#8ea1ff" stroke-opacity=".07"/></pattern>

</defs>
<rect width="1200" height="500" rx="24" fill="url(#bg)"/>
<rect x="1" y="1" width="1198" height="498" rx="23" fill="none" stroke="#8ea1ff" stroke-opacity=".28"/>
<rect x="1" y="1" width="1198" height="498" rx="23" fill="url(#grid)"/>
<text x="56" y="70" fill="#f4f0dd" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="25" font-weight="800" text-anchor="start" letter-spacing="2">ARTIFACT CONSTELLATION</text>
<text x="1144" y="70" fill="#8ea1ff" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600" text-anchor="end" letter-spacing="1.2">FIVE IMAGES / ONE VERIFICATION FIELD</text>
<path d="M130 275 C245.0 205 245.0 290 360 220" fill="none" stroke="#8ea1ff" stroke-opacity=".34" stroke-width="2"/>
<text x="245.0" y="190" fill="#9aa7cc" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600" text-anchor="middle" letter-spacing="1">SAME SOURCE</text>
<path d="M590 292 C705.0 222 705.0 275 820 205" fill="none" stroke="#8ea1ff" stroke-opacity=".34" stroke-width="2"/>
