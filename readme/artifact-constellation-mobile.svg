<text x="470" y="472" fill="#f1f4ff" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="28" font-weight="700" text-anchor="middle" letter-spacing="1">VM</text>
<circle cx="250" cy="640" r="88" fill="#0a0f1d" stroke="#ff6b8a" stroke-opacity=".35"/>
<circle cx="250" cy="640" r="78" fill="#11182c" stroke="#ff6b8a" stroke-width="4"/>
<text x="250" y="632" fill="#ff6b8a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="38" font-weight="800" text-anchor="middle" letter-spacing="0">512 B</text>
<text x="250" y="672" fill="#f1f4ff" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="28" font-weight="700" text-anchor="middle" letter-spacing="1">CPL3</text>
<circle cx="470" cy="840" r="88" fill="#0a0f1d" stroke="#8ea1ff" stroke-opacity=".35"/>
<circle cx="470" cy="840" r="78" fill="#11182c" stroke="#8ea1ff" stroke-width="4"/>
