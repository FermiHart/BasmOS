<text x="470" y="872" fill="#f1f4ff" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="28" font-weight="700" text-anchor="middle" letter-spacing="1">JASH</text>
<circle cx="250" cy="1050" r="106" fill="#0a0f1d" stroke="#d58cff" stroke-opacity=".35"/>
<circle cx="250" cy="1050" r="96" fill="#11182c" stroke="#d58cff" stroke-width="4"/>
<text x="250" y="1042" fill="#d58cff" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="38" font-weight="800" text-anchor="middle" letter-spacing="0">3584 B</text>
<text x="250" y="1082" fill="#f1f4ff" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="28" font-weight="700" text-anchor="middle" letter-spacing="1">J-PACK</text>
