# SPDX-License-Identifier: BSD-3-Clause
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential nasm nodejs python3 qemu-system-x86

      - name: Build exact artifacts
        run: make all

      - name: Verify executable Metatron source art
        run: make verify-sacred

      - name: Verify artifact-bound README geometry
        run: make verify-readme

      - name: Verify committed hashes
        run: |
          sha256sum -c SHA256SUMS
          sha256sum -c evidence/jash-session.manifest

      - name: Verify QEMU and browser contracts
        run: make verify-ci

      - name: Verify Pages staging and README links
        run: make verify-site

      - name: Require KVM
        run: |
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm

      - name: Verify KVM contracts (domains, IPC and both personalities)
        run: |
          make verify-domains verify-ipc verify-bemu verify-shell-bemu \
            verify-jash-bemu verify-jash-capture
          python3 verify_jash_fuzz.py bemu/bemu-nano basmos-sh.bin \
            jash/jash.bin jash/jash-pack.bin

      - name: Check independent NASM assembly
        run: make verify-nasm

      - name: Ensure generated artifacts are current
        run: make manifest && git diff --exit-code -- ARTIFACTS.manifest SHA256SUMS basmos.bin basmos-vm.bin basmos-sh.bin jash/jash.bin jash/jash-pack.bin
