# SPDX-License-Identifier: BSD-3-Clause
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential clang nasm nodejs python3 qemu-system-x86

      - name: Verify toolchain entrypoint
        run: make toolchain

      - name: Verify assembler contracts with GCC, Clang and sanitizers
        run: make -f Makefile.upgrade upgrade-test

      - name: Grant KVM access when present (full proof enforces it)
        run: |
          if [ -c /dev/kvm ]; then
            sudo chmod a+rw /dev/kvm
          fi

      - name: Run the canonical complete proof
        run: make proof

      - name: Verify committed JASH capture integrity
        run: sha256sum -c evidence/jash-session.manifest

      - name: Ensure generated artifacts are current
        run: make manifest && git diff --exit-code -- ARTIFACTS.manifest SHA256SUMS basmos.bin basmos-vm.bin basmos-sh.bin jash/jash.bin jash/jash-pack.bin

      - name: Upload complete proof diagnostics (pass or fail)
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: basmos-proof-${{ github.sha }}
          path: |
            evidence/PROOF-REPORT.json
            evidence/PROOF-REPORT.md
            evidence/PROOF-REPORT.log
          if-no-files-found: warn
          retention-days: 14
